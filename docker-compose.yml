name: aquant

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [aquant]

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquant-local-only}
      POSTGRES_DB: aquant
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init/001_databases.sql:/docker-entrypoint-initdb.d/001_databases.sql:ro
      - ./infra/postgres/migrations/001_reference_and_ingestion.sql:/docker-entrypoint-initdb.d/002_reference_and_ingestion.sql:ro
      - ./infra/postgres/migrations/002_research_and_execution.sql:/docker-entrypoint-initdb.d/003_research_and_execution.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aquant"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prefect:
    <<: *service-defaults
    build:
      context: ./infra/prefect
      args:
        PREFECT_VERSION: "3.4.9"
    command: ["server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-aquant}:${POSTGRES_PASSWORD:-aquant-local-only}@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${PREFECT_HOST_PORT:-4200}:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mlflow:
    <<: *service-defaults
    build:
      context: ./infra/mlflow
      args:
        MLFLOW_VERSION: "3.1.1"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg2://${POSTGRES_USER:-aquant}:${POSTGRES_PASSWORD:-aquant-local-only}@postgres:5432/mlflow
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  aquant:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mlflow-artifacts:
